<script>
  // Apply any stored theme choice immediately, before first paint, so there's
  // no flash of the wrong theme. No stored value means no attribute at all,
  // letting prefers-color-scheme decide, matching every other page on the site.
  (function(){
    var t = localStorage.getItem('primelevel-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    // Same idea for the rail: if it was hover-expanded on the page we just
    // navigated away from (a real click while hovering the nav), start this
    // page already expanded too, before first paint -- so clicking between
    // nav items feels continuous instead of the rail flashing shut and
    // reopening on every page load (each page here is a full reload, not
    // a single-page app, so plain CSS :hover can't survive navigation
    // on its own).
    try {
      if (sessionStorage.getItem('primelevel-rail-expanded') === '1') {
        document.documentElement.setAttribute('data-rail', 'expanded');
      }
    } catch (e) { /* storage disabled -- falls back to plain :hover, no crash */ }
  })();
</script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --bg:#DADBDE; --surface:#F9F9FA; --surface-2:#F1EFE9; --border:#E3DFD3;
    --text:#1E2633; --text-soft:#5C6472; --text-faint:#8B92A0;
    --brand-navy:#1E2633; --brand-gold:#B29B68; --brand-gold-soft:#B29B68;
    --good:#2F7D5B; --good-bg:#E6F1EB; --warn:#B4552B; --warn-bg:#F6E7DE;
    --info:#3D5A80; --info-bg:#E7ECF2;
    --shadow: 0 1px 2px rgba(30,38,51,0.06), 0 8px 24px rgba(30,38,51,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12171F; --surface:#1E2633; --surface-2:#242E3B; --border:rgba(249,249,250,0.14);
      --text:#F1EEE6; --text-soft:#A7AEBA; --text-faint:#7B8393;
      --brand-navy:#AFC3E6; --brand-gold:#B29B68; --brand-gold-soft:#B29B68;
      --good:#57B78E; --good-bg:#1D3A30; --warn:#DD8E5D; --warn-bg:#402C1F;
      --info:#87A6CE; --info-bg:#22314A;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12171F; --surface:#1E2633; --surface-2:#242E3B; --border:rgba(249,249,250,0.14);
    --text:#F1EEE6; --text-soft:#A7AEBA; --text-faint:#7B8393;
    --brand-navy:#AFC3E6; --brand-gold:#B29B68; --brand-gold-soft:#B29B68;
    --good:#57B78E; --good-bg:#1D3A30; --warn:#DD8E5D; --warn-bg:#402C1F;
    --info:#87A6CE; --info-bg:#22314A;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ margin:0; padding:0; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Archivo',ui-sans-serif,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .shell{ display:flex; min-height:100vh; }
  .rail{ position:relative; width:48px; flex:none; }
  .rail-brand-fixed{
    position:absolute; top:0; left:0; width:48px; height:48px; z-index:22;
    background:#1E2633; display:flex; align-items:center; justify-content:center;
    border-bottom:1px solid rgba(249,249,250,0.14);
  }
  .rail-inner{
    position:absolute; top:48px; left:0; bottom:0; width:48px; overflow:hidden;
    background:#1E2633; display:flex; flex-direction:column; gap:4px; padding:10px 8px;
    border-right:1px solid rgba(249,249,250,0.14);
    transition:width 0.15s ease; z-index:20;
  }
  .rail:hover .rail-inner, :root[data-rail="expanded"] .rail-inner{ width:208px; box-shadow:2px 0 16px rgba(0,0,0,0.18); }
  .brand-mark{ width:30px;height:30px;border-radius:7px; overflow:hidden; display:flex;align-items:center;justify-content:center; flex:none; }
  .brand-mark img{ width:100%; height:100%; object-fit:cover; display:block; }
  .rail-nav{ display:flex; flex-direction:column; gap:2px; }
  .rail-item{
    display:flex; align-items:center; gap:10px; height:32px; padding:0 7px; border-radius:8px;
    color:#989A99; text-decoration:none; white-space:nowrap; overflow:hidden;
    transition:background 0.1s, color 0.1s;
  }
  .rail-item:hover{ background:var(--bg); color:var(--text); }
  .rail-item:focus{ outline:none; }
  .rail-item:focus-visible{ outline:2px solid var(--brand-gold); outline-offset:-2px; }
  .rail-item.active{ background:var(--bg); color:var(--text); }
  .rail-icon{ flex:none; width:18px; text-align:center; font-size:13px; font-weight:600; }
  .rail-label{ font-size:13px; font-weight:500; opacity:0; transition:opacity 0.1s; }
  .rail:hover .rail-label, :root[data-rail="expanded"] .rail-label{ opacity:1; transition-delay:0.05s; }

  .main-col{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{ height:48px; flex:none; display:flex; align-items:center; justify-content:flex-end; padding:0 20px; background:#1E2633; border-bottom:1px solid rgba(249,249,250,0.14); }
  @media (prefers-color-scheme: dark){ .topbar{ background:var(--surface); } }
  :root[data-theme="dark"] .topbar{ background:var(--surface); }
  .topbar-right{ position:relative; }
  .avatar-btn{ width:32px; height:32px; border-radius:50%; border:none; cursor:pointer; overflow:hidden; padding:0; background:var(--brand-navy); color:#F7F4EC; font-family:'Fraunces',serif; font-weight:600; font-size:13px; display:flex; align-items:center; justify-content:center; }
  :root[data-theme="dark"] .avatar-btn{ background:var(--brand-gold); color:#1A1406; }
  @media (prefers-color-scheme:dark){ .avatar-btn{ background:var(--brand-gold); color:#1A1406; } }
  .avatar-btn img{ width:100%; height:100%; object-fit:cover; display:block; }
  .account-menu{ position:absolute; top:40px; right:0; width:256px; background:#1E2633; border:1px solid rgba(249,249,250,0.14); border-radius:8px; box-shadow:0 4px 6px -1px rgba(0,0,0,0.10), 0 2px 4px -2px rgba(0,0,0,0.10); padding:6px; z-index:30; }

  .account-menu-name{ font-size:13px; font-weight:600; color:#F7F4EC; }
  .account-menu-email{ font-size:12px; color:#A7AEBA; margin-top:1px; }
  .account-menu-sep{ height:1px; background:rgba(249,249,250,0.14); margin:4px 0; }

  .account-menu-item:hover{ background:var(--bg); color:var(--text); }
  .account-menu-theme-label{ padding:8px 12px 4px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:#7B8393; }
  .theme-option{
    width:100%; display:flex; align-items:center; gap:10px; border:none; background:none;
    font-family:inherit; text-align:left;

  .theme-dot{ width:6px; height:6px; border-radius:50%; background:transparent; flex:none; }
  .theme-option.active .theme-dot{ background:var(--brand-gold); }
  .theme-option.active{ color:#F7F4EC; font-weight:600; }

  main{ padding:32px 40px 64px; max-width:1120px; }
  .page-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:24px; margin-bottom:22px; }
  .page-head h1{ font-family:'Fraunces',serif; font-weight:500; font-size:27px; margin:0 0 4px; }
  .page-head p{ margin:0; color:var(--text-soft); font-size:13.5px; }
  .new-invoice{ flex:none; background:var(--brand-navy); color:#F7F4EC; border:none; border-radius:9px; padding:10px 16px; font-family:'Archivo',sans-serif; font-weight:600; font-size:13px; cursor:pointer; }
  :root[data-theme="dark"] .new-invoice{ background:var(--brand-gold); color:#1A1406; }
  @media (prefers-color-scheme:dark){ .new-invoice{ background:var(--brand-gold); color:#1A1406; } }

  /* toolbar */
  .toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .filter-pills{ display:flex; gap:6px; }
  .fpill{ font-size:12.5px; font-weight:600; padding:7px 13px; border-radius:100px; border:1px solid var(--border); background:var(--surface); color:var(--text-soft); cursor:pointer; }
  .fpill.active{ background:var(--brand-navy); color:#F7F4EC; border-color:var(--brand-navy); }
  :root[data-theme="dark"] .fpill.active{ background:var(--brand-gold); color:#1A1406; border-color:var(--brand-gold); }
  .search{ margin-left:auto; display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:8px 12px; font-size:13px; color:var(--text-faint); min-width:220px; }

  .invoice-panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; margin-bottom:18px; }
  table{ width:100%; border-collapse:collapse; }
  thead th{ text-align:left; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-faint); padding:13px 18px; border-bottom:1px solid var(--border); }
  tbody td{ padding:13px 18px; font-size:13.5px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover td{ background:var(--surface-2); }
  td.amt{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; font-weight:600; text-align:right; }
  td.job-cell .client{ font-weight:600; color:var(--text); }
  td.job-cell .desc{ font-size:12px; color:var(--text-faint); margin-top:2px; }
  td.inv-no{ font-family:'IBM Plex Mono',ui-monospace,monospace; color:var(--text-faint); font-size:12px; }
  .status{ display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; padding:4px 9px; border-radius:100px; }
  .status.paid{ color:var(--good); background:var(--good-bg); }
  .status.due{ color:var(--info); background:var(--info-bg); }
  .status.overdue{ color:var(--warn); background:var(--warn-bg); }
  .status.draft{ color:var(--text-faint); background:var(--surface-2); }
  .row-action{ font-size:12px; color:var(--info); font-weight:600; text-decoration:none; }

  .pager{ display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--text-faint); }
  .pager .btns{ display:flex; gap:6px; }
  .pgbtn{ border:1px solid var(--border); background:var(--surface); border-radius:7px; padding:6px 11px; color:var(--text-soft); font-size:12.5px; cursor:pointer; }

  @media (max-width:920px){
    .rail{ display:none; }
    table{ font-size:12.5px; }
    .search{ min-width:140px; }
  }
</style>

<script>window.requireSession=async()=>({membership:{account_id:"t",accounts:{business_name:"Test Biz"}},session:{user:{email:"t@t.co"}}});window.wireSignOut=()=>{};window.showTrialBannerIfNeeded=()=>{};window.supabaseClient={from:()=>({select:()=>({eq:()=>({order:async()=>({data:[],error:null}),maybeSingle:async()=>({data:null,error:null})}),maybeSingle:async()=>({data:null,error:null})})})};</script>
<script>
  let allInvoices = [];
  let currentFilter = 'all';
  let currentSearch = '';
  let currentAccountId = null;

  function fmtDate(iso) {
    if (!iso) return '—';
    return new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  }
  function fmtMoney(n) {
    return '£' + Number(n).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function daysOverdue(dueDate) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const due = new Date(dueDate + 'T00:00:00');
    return Math.round((today - due) / 86400000);
  }
  function effectiveStatus(inv) {
    if (inv.status === 'sent' && daysOverdue(inv.due_date) > 0) return 'overdue';
    return inv.status;
  }

  async function loadInvoices() {
    const { data, error } = await supabaseClient
      .from('invoices')
      .select('id, invoice_number, job_description, amount, job_date, due_date, status, sent_at, created_at, clients(name)')
      .eq('account_id', currentAccountId)
      .order('created_at', { ascending: false });

    if (error) {
      document.getElementById('invoiceRows').innerHTML = '<tr><td colspan="6" style="text-align:center; color:var(--warn);">Could not load invoices right now.</td></tr>';
      return;
    }
    allInvoices = data || [];
    updateFilterCounts();
    render();
  }

  function updateFilterCounts() {
    const counts = { all: allInvoices.length, sent: 0, overdue: 0, paid: 0, draft: 0 };
    allInvoices.forEach((inv) => {
      const st = effectiveStatus(inv);
      if (st === 'sent') counts.sent++;
      else if (st === 'overdue') counts.overdue++;
      else if (st === 'paid') counts.paid++;
      else if (st === 'draft') counts.draft++;
    });
    document.querySelectorAll('#filterPills .fpill').forEach((btn) => {
      const key = btn.dataset.filter;
      const label = { all: 'All', sent: 'Due', overdue: 'Overdue', paid: 'Paid', draft: 'Draft' }[key];
      btn.textContent = `${label} (${counts[key]})`;
    });
  }

  function render() {
    let rows = allInvoices;
    if (currentFilter !== 'all') rows = rows.filter((inv) => effectiveStatus(inv) === currentFilter);
    if (currentSearch) {
      const q = currentSearch.toLowerCase();
      rows = rows.filter((inv) =>
        (inv.clients?.name || '').toLowerCase().includes(q) ||
        (inv.job_description || '').toLowerCase().includes(q)
      );
    }

    const tbody = document.getElementById('invoiceRows');
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:var(--text-faint); padding:24px;">No invoices to show yet.</td></tr>';
    } else {
      tbody.innerHTML = rows.map((inv) => {
        const st = effectiveStatus(inv);
        const statusHtml = st === 'paid' ? '<span class="status paid">Paid</span>'
          : st === 'overdue' ? `<span class="status overdue">Overdue ${daysOverdue(inv.due_date)} days</span>`
          : st === 'draft' ? '<span class="status draft">Draft</span>'
          : `<span class="status due">Due ${fmtDate(inv.due_date)}</span>`;

        const actionHtml = st === 'draft'
          ? `<a class="row-action" href="#" data-send-id="${inv.id}">Send →</a>`
          : (st === 'sent' || st === 'overdue')
            ? `<span class="pay-choice" data-row-for="${inv.id}">
                 <a class="row-action" href="#" data-mark-paid-open="${inv.id}">Mark Paid</a> &nbsp; <a class="row-action" href="invoice-new.html?id=${inv.id}">View →</a>
               </span>`
            : `<a class="row-action" href="invoice-new.html?id=${inv.id}">View →</a>`;

        return `<tr>
          <td class="inv-no">${inv.invoice_number}</td>
          <td class="job-cell"><div class="client">${inv.clients?.name || 'Unknown client'}</div><div class="desc">${inv.job_description}</div></td>
          <td>${inv.sent_at ? fmtDate(inv.sent_at.slice(0, 10)) : '—'}</td>
          <td>${statusHtml}</td>
          <td class="amt">${fmtMoney(inv.amount)}</td>
          <td>${actionHtml}</td>
        </tr>`;
      }).join('');
    }

    document.getElementById('pagerText').textContent = `Showing ${rows.length} of ${allInvoices.length} invoice${allInvoices.length === 1 ? '' : 's'}`;

    async function markPaid(id, method) {
      const { error } = await supabaseClient
        .from('invoices')
        .update({ status: 'paid', payment_method: method })
        .eq('id', id);
      if (error) alert('Could not mark this as paid right now — please try again.');
      else loadInvoices();
    }

    tbody.querySelectorAll('[data-mark-paid-open]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        const id = el.getAttribute('data-mark-paid-open');
        const wrap = el.closest('.pay-choice');
        wrap.innerHTML = `
          <span style="font-size:12px; color:var(--text-faint);">Paid by:</span>
          <a class="row-action" href="#" data-pay-method="cash" data-pay-id="${id}">Cash</a> &nbsp;
          <a class="row-action" href="#" data-pay-method="bank_transfer" data-pay-id="${id}">Bank transfer</a> &nbsp;
          <a class="row-action" href="#" data-pay-cancel="1" style="color:var(--text-faint);">Cancel</a>`;
        wrap.querySelectorAll('[data-pay-method]').forEach((btn) => {
          btn.addEventListener('click', (e2) => {
            e2.preventDefault();
            markPaid(btn.getAttribute('data-pay-id'), btn.getAttribute('data-pay-method'));
          });
        });
        wrap.querySelector('[data-pay-cancel]').addEventListener('click', (e2) => {
          e2.preventDefault();
          render();
        });
      });
    });

    tbody.querySelectorAll('[data-send-id]').forEach((el) => {
      el.addEventListener('click', async (e) => {
        e.preventDefault();
        const id = el.getAttribute('data-send-id');
        const { error } = await supabaseClient.from('invoices').update({ status: 'sent' }).eq('id', id);
        if (!error) loadInvoices();
      });
    });
  }

  document.getElementById('filterPills').addEventListener('click', (e) => {
    const btn = e.target.closest('.fpill');
    if (!btn) return;
    document.querySelectorAll('#filterPills .fpill').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });

  document.getElementById('searchInput').addEventListener('input', (e) => {
    currentSearch = e.target.value.trim();
    render();
  });

  const GENERIC_PROFILE_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/><path d="M9 9v.01M9 12v.01M9 15v.01M9 18v.01"/></svg>';

  function applyTheme(choice) {
    document.documentElement.setAttribute('data-theme', choice);
    localStorage.setItem('primelevel-theme', choice);
    document.querySelectorAll('.theme-option').forEach((el) => {
      el.classList.toggle('active', el.dataset.themeChoice === choice);
    });
  }
  function wireThemeSwitcher() {
    const stored = localStorage.getItem('primelevel-theme');
    const current = (stored === 'light' || stored === 'dark')
      ? stored
      : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.querySelectorAll('.theme-option').forEach((el) => {
      el.classList.toggle('active', el.dataset.themeChoice === current);
      el.addEventListener('click', () => applyTheme(el.dataset.themeChoice));
    });
  }

  // Keeps the rail's hover-expanded state alive across a real page
  // navigation (each nav link is a full page load, not client-side
  // routing, so plain CSS :hover can't survive a click on its own).
  // The early inline script in <head> already applied data-rail=
  // "expanded" before paint if sessionStorage said so; here we (a) keep
  // sessionStorage in sync going forward via real mouseenter/mouseleave,
  // and (b) correct a stale "expanded" start if the very first mousemove
  // on this page shows the cursor isn't actually over the rail (e.g. the
  // user clicked then moved away before this page finished loading).
  (function wireRailPersistence() {
    const rail = document.querySelector('.rail');
    if (!rail) return;
    const set = (v) => { try { sessionStorage.setItem('primelevel-rail-expanded', v); } catch (e) {} };
    const expand = () => { document.documentElement.setAttribute('data-rail', 'expanded'); set('1'); };
    const collapse = () => { document.documentElement.removeAttribute('data-rail'); set('0'); };

    // Once a nav link is clicked we are navigating -- lock the flag ON so no
    // late pointer event (a mouseleave/pointermove fired while the old page
    // tears down) can flip it OFF before the next page reads it.
    let navigating = false;
    rail.addEventListener('click', (e) => {
      if (e.target.closest('.rail-item')) { navigating = true; set('1'); }
    });

    // Single source of truth for the rest of the page's life: the rail is
    // expanded iff the pointer is actually over it. This re-asserts the
    // correct state on the very first pointer move after load, which fixes
    // the "cursor was already resting here / already moved away" cases that
    // plain CSS :hover gets wrong across a full page load.
    document.addEventListener('pointermove', (e) => {
      if (navigating) return;
      if (e.target && e.target.closest && e.target.closest('.rail')) expand();
      else collapse();
    }, { passive: true });
  })();

  async function wireAccountMenu(accountId, businessName, email) {
    const btn = document.getElementById('accountBtn');
    const menu = document.getElementById('accountMenu');
    wireThemeSwitcher();

    const { data: account } = await supabaseClient
      .from('accounts')
      .select('logo_url')
      .eq('id', accountId)
      .maybeSingle();

    btn.innerHTML = account?.logo_url
      ? `<img src="${account.logo_url}" alt="${businessName}">`
      : GENERIC_PROFILE_ICON;

    document.getElementById('accountMenuName').textContent = businessName;
    document.getElementById('accountMenuEmail').textContent = email || '';

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      menu.hidden = !menu.hidden;
    });
    document.addEventListener('click', (e) => {
      if (!menu.hidden && !menu.contains(e.target) && e.target !== btn) menu.hidden = true;
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') menu.hidden = true;
    });
  }

  (async () => {
    const result = await requireSession();
    if (!result) return;

    currentAccountId = result.membership.account_id;
    const businessName = result.membership.accounts?.business_name || 'Your business';
    wireAccountMenu(currentAccountId, businessName, result.session.user.email);
    wireSignOut();
    showTrialBannerIfNeeded(currentAccountId);

    loadInvoices();
  })();
</script>

  L('data-rail on <html>: '+JSON.stringify(document.documentElement.getAttribute('data-rail')));
  var ri=document.querySelector('.rail-inner');
  L('.rail-inner computed width: '+(ri?getComputedStyle(ri).width:'no el'));

    L('first mousemove: target='+e.target.tagName+'.'+e.target.className+' closest(.rail)='+!!(e.target.closest&&e.target.closest('.rail')));
    window.removeEventListener('mousemove',once);

</script>
