<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PrimeLevel Invoices</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app-shell.css">
<style>
  :root{
    --bg:#12171F; --surface:#1E2633; --surface-2:#242E3B; --border:rgba(249,249,250,0.14);
    --text:#F1EEE6; --text-soft:#A7AEBA; --text-faint:#7B8393;
    --brand-navy:#AFC3E6; --brand-gold:#B29B68; --brand-gold-soft:#B29B68;
    --good:#57B78E; --good-bg:#1D3A30; --warn:#DD8E5D; --warn-bg:#402C1F;
    --info:#87A6CE; --info-bg:#22314A;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ margin:0; padding:0; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Archivo',ui-sans-serif,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }


  main{ padding:32px 40px 64px; max-width:1120px; }
  .page-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:24px; margin-bottom:22px; }
  .page-head h1{ font-family:'Fraunces',serif; font-weight:500; font-size:27px; margin:0 0 4px; }
  .page-head p{ margin:0; color:var(--text-soft); font-size:13.5px; }
  .new-invoice{ flex:none; background:var(--brand-gold); color:#1A1406; border:none; border-radius:9px; padding:10px 16px; font-family:'Archivo',sans-serif; font-weight:600; font-size:13px; cursor:pointer; }

  /* toolbar */
  .toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .filter-pills{ display:flex; gap:6px; }
  .fpill{ font-size:12.5px; font-weight:600; padding:7px 13px; border-radius:100px; border:1px solid var(--border); background:var(--surface); color:var(--text-soft); cursor:pointer; }
  .fpill.active{ background:var(--brand-gold); color:#1A1406; border-color:var(--brand-gold); }
  .search{ margin-left:auto; display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:8px 12px; font-size:13px; color:var(--text-faint); min-width:220px; }

  .invoice-panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; margin-bottom:18px; }
  table{ width:100%; border-collapse:collapse; }
  thead th{ text-align:left; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-faint); padding:13px 18px; border-bottom:1px solid var(--border); }
  tbody td{ padding:13px 18px; font-size:13.5px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover td{ background:var(--surface-2); }
  td.amt{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; font-weight:600; text-align:right; }
  td.job-cell .client{ font-weight:600; color:var(--text); }
  td.job-cell .desc{ font-size:12px; color:var(--text-faint); margin-top:2px; }
  td.inv-no{ font-family:'IBM Plex Mono',ui-monospace,monospace; color:var(--text-faint); font-size:12px; }
  .status{ display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; padding:4px 9px; border-radius:100px; }
  .status.paid{ color:var(--good); background:var(--good-bg); }
  .status.due{ color:var(--info); background:var(--info-bg); }
  .status.overdue{ color:var(--warn); background:var(--warn-bg); }
  .status.draft{ color:var(--text-faint); background:var(--surface-2); }
  .row-action{ font-size:12px; color:var(--info); font-weight:600; text-decoration:none; }

  .pager{ display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--text-faint); }
  .pager .btns{ display:flex; gap:6px; }
  .pgbtn{ border:1px solid var(--border); background:var(--surface); border-radius:7px; padding:6px 11px; color:var(--text-soft); font-size:12.5px; cursor:pointer; }

  @media (max-width:920px){
    .rail{ display:none; }
    table{ font-size:12.5px; }
    .search{ min-width:140px; }
  }
</style>
</head>
<body>
<div class="shell">
<div class="shell-topline"></div>

<aside class="rail">
    <div class="rail-brand-fixed"><div class="brand-mark"><img src="assets/primelevel-icon.png" alt="PrimeLevel"></div></div>
    <div class="rail-inner">
      <nav class="rail-nav">
        <a class="rail-item" href="dashboard.html"><span class="rail-icon">D</span><span class="rail-label">Dashboard</span></a>
        <a class="rail-item active" href="invoices.html"><span class="rail-icon">I</span><span class="rail-label">Invoices</span></a>
        <a class="rail-item" href="payments.html"><span class="rail-icon">£</span><span class="rail-label">Payments</span></a>
        <a class="rail-item" href="insights.html"><span class="rail-icon">◎</span><span class="rail-label">Insights</span></a>
        <a class="rail-item" href="renewals.html"><span class="rail-icon">↻</span><span class="rail-label">Renewals</span></a>
        <a class="rail-item" href="plans.html"><span class="rail-icon">$</span><span class="rail-label">Plans &amp; Billing</span></a>
        <a class="rail-item" href="team.html"><span class="rail-icon">T</span><span class="rail-label">Team</span></a>
        <a class="rail-item" href="settings.html"><span class="rail-icon">⚙</span><span class="rail-label">Settings</span></a>
      </nav>
    </div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <div class="topbar-crumb"></div>
      <div class="topbar-right">
        <button class="avatar-btn" id="accountBtn" title="Account settings"></button>
        <div class="account-menu" id="accountMenu" hidden>
          <div class="account-menu-head">
            <div class="account-menu-name" id="accountMenuName">…</div>
            <div class="account-menu-email" id="accountMenuEmail">…</div>
          </div>
          <a class="account-menu-item" href="settings.html">Account settings</a>
          <div class="account-menu-sep"></div>
          <a class="account-menu-item" href="#" data-sign-out>Sign out</a>
        </div>
      </div>
    </header>

    <main>
      <div class="page-head">
        <div>
          <h1>Invoices</h1>
          <p>Every invoice you've sent, all in one place.</p>
        </div>
        <a class="new-invoice" href="invoice-new.html" style="text-decoration:none; display:inline-block;">+ New invoice</a>
      </div>

      <div class="toolbar">
        <div class="filter-pills" id="filterPills">
          <button class="fpill active" data-filter="all">All (0)</button>
          <button class="fpill" data-filter="sent">Due (0)</button>
          <button class="fpill" data-filter="overdue">Overdue (0)</button>
          <button class="fpill" data-filter="paid">Paid (0)</button>
          <button class="fpill" data-filter="draft">Draft (0)</button>
        </div>
        <div class="search" style="padding:0;"><input id="searchInput" type="text" placeholder="🔍 Search client or job…" style="border:none; background:none; color:var(--text); font-family:inherit; font-size:13px; width:100%; padding:8px 12px; outline:none;"></div>
      </div>

      <div class="invoice-panel">
        <table>
          <thead>
            <tr><th>Invoice</th><th>Client &amp; job</th><th>Sent</th><th>Status</th><th style="text-align:right;">Amount</th><th></th></tr>
          </thead>
          <tbody id="invoiceRows">
            <tr><td colspan="6" style="text-align:center; color:var(--text-faint);">Loading…</td></tr>
          </tbody>
        </table>
      </div>

      <div class="pager">
        <span id="pagerText">Showing 0 invoices</span>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app-shell.js?v=3"></script>
<script>
  let allInvoices = [];
  let currentFilter = 'all';
  let currentSearch = '';
  let currentAccountId = null;

  function fmtDate(iso) {
    if (!iso) return '—';
    return new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  }
  function fmtMoney(n) {
    return '£' + Number(n).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function daysOverdue(dueDate) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const due = new Date(dueDate + 'T00:00:00');
    return Math.round((today - due) / 86400000);
  }
  function effectiveStatus(inv) {
    if (inv.status === 'sent' && daysOverdue(inv.due_date) > 0) return 'overdue';
    return inv.status;
  }

  async function loadInvoices() {
    const { data, error } = await supabaseClient
      .from('invoices')
      .select('id, invoice_number, job_description, amount, job_date, due_date, status, sent_at, created_at, clients(name)')
      .eq('account_id', currentAccountId)
      .order('created_at', { ascending: false });

    if (error) {
      document.getElementById('invoiceRows').innerHTML = '<tr><td colspan="6" style="text-align:center; color:var(--warn);">Could not load invoices right now.</td></tr>';
      return;
    }
    allInvoices = data || [];
    updateFilterCounts();
    render();
  }

  function updateFilterCounts() {
    const counts = { all: allInvoices.length, sent: 0, overdue: 0, paid: 0, draft: 0 };
    allInvoices.forEach((inv) => {
      const st = effectiveStatus(inv);
      if (st === 'sent') counts.sent++;
      else if (st === 'overdue') counts.overdue++;
      else if (st === 'paid') counts.paid++;
      else if (st === 'draft') counts.draft++;
    });
    document.querySelectorAll('#filterPills .fpill').forEach((btn) => {
      const key = btn.dataset.filter;
      const label = { all: 'All', sent: 'Due', overdue: 'Overdue', paid: 'Paid', draft: 'Draft' }[key];
      btn.textContent = `${label} (${counts[key]})`;
    });
  }

  function render() {
    let rows = allInvoices;
    if (currentFilter !== 'all') rows = rows.filter((inv) => effectiveStatus(inv) === currentFilter);
    if (currentSearch) {
      const q = currentSearch.toLowerCase();
      rows = rows.filter((inv) =>
        (inv.clients?.name || '').toLowerCase().includes(q) ||
        (inv.job_description || '').toLowerCase().includes(q)
      );
    }

    const tbody = document.getElementById('invoiceRows');
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:var(--text-faint); padding:24px;">No invoices to show yet.</td></tr>';
    } else {
      tbody.innerHTML = rows.map((inv) => {
        const st = effectiveStatus(inv);
        const statusHtml = st === 'paid' ? '<span class="status paid">Paid</span>'
          : st === 'overdue' ? `<span class="status overdue">Overdue ${daysOverdue(inv.due_date)} days</span>`
          : st === 'draft' ? '<span class="status draft">Draft</span>'
          : `<span class="status due">Due ${fmtDate(inv.due_date)}</span>`;

        const actionHtml = st === 'draft'
          ? `<a class="row-action" href="#" data-send-id="${inv.id}">Send →</a>`
          : (st === 'sent' || st === 'overdue')
            ? `<span class="pay-choice" data-row-for="${inv.id}">
                 <a class="row-action" href="#" data-mark-paid-open="${inv.id}">Mark Paid</a> &nbsp; <a class="row-action" href="invoice-new.html?id=${inv.id}">View →</a>
               </span>`
            : `<a class="row-action" href="invoice-new.html?id=${inv.id}">View →</a>`;

        return `<tr>
          <td class="inv-no">${inv.invoice_number}</td>
          <td class="job-cell"><div class="client">${inv.clients?.name || 'Unknown client'}</div><div class="desc">${inv.job_description}</div></td>
          <td>${inv.sent_at ? fmtDate(inv.sent_at.slice(0, 10)) : '—'}</td>
          <td>${statusHtml}</td>
          <td class="amt">${fmtMoney(inv.amount)}</td>
          <td>${actionHtml}</td>
        </tr>`;
      }).join('');
    }

    document.getElementById('pagerText').textContent = `Showing ${rows.length} of ${allInvoices.length} invoice${allInvoices.length === 1 ? '' : 's'}`;

    async function markPaid(id, method) {
      const { error } = await supabaseClient
        .from('invoices')
        .update({ status: 'paid', payment_method: method })
        .eq('id', id);
      if (error) alert('Could not mark this as paid right now — please try again.');
      else loadInvoices();
    }

    tbody.querySelectorAll('[data-mark-paid-open]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        const id = el.getAttribute('data-mark-paid-open');
        const wrap = el.closest('.pay-choice');
        wrap.innerHTML = `
          <span style="font-size:12px; color:var(--text-faint);">Paid by:</span>
          <a class="row-action" href="#" data-pay-method="cash" data-pay-id="${id}">Cash</a> &nbsp;
          <a class="row-action" href="#" data-pay-method="bank_transfer" data-pay-id="${id}">Bank transfer</a> &nbsp;
          <a class="row-action" href="#" data-pay-cancel="1" style="color:var(--text-faint);">Cancel</a>`;
        wrap.querySelectorAll('[data-pay-method]').forEach((btn) => {
          btn.addEventListener('click', (e2) => {
            e2.preventDefault();
            markPaid(btn.getAttribute('data-pay-id'), btn.getAttribute('data-pay-method'));
          });
        });
        wrap.querySelector('[data-pay-cancel]').addEventListener('click', (e2) => {
          e2.preventDefault();
          render();
        });
      });
    });

    tbody.querySelectorAll('[data-send-id]').forEach((el) => {
      el.addEventListener('click', async (e) => {
        e.preventDefault();
        const id = el.getAttribute('data-send-id');
        const { error } = await supabaseClient.from('invoices').update({ status: 'sent' }).eq('id', id);
        if (!error) loadInvoices();
      });
    });
  }

  document.getElementById('filterPills').addEventListener('click', (e) => {
    const btn = e.target.closest('.fpill');
    if (!btn) return;
    document.querySelectorAll('#filterPills .fpill').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });

  document.getElementById('searchInput').addEventListener('input', (e) => {
    currentSearch = e.target.value.trim();
    render();
  });

  const GENERIC_PROFILE_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/><path d="M9 9v.01M9 12v.01M9 15v.01M9 18v.01"/></svg>';

  async function wireAccountMenu(accountId, businessName, email) {
    const btn = document.getElementById('accountBtn');
    const menu = document.getElementById('accountMenu');

    const { data: account } = await supabaseClient
      .from('accounts')
      .select('logo_url')
      .eq('id', accountId)
      .maybeSingle();

    btn.innerHTML = account?.logo_url
      ? `<img src="${account.logo_url}" alt="${businessName}">`
      : GENERIC_PROFILE_ICON;

    document.getElementById('accountMenuName').textContent = businessName;
    document.getElementById('accountMenuEmail').textContent = email || '';

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      menu.hidden = !menu.hidden;
    });
    document.addEventListener('click', (e) => {
      if (!menu.hidden && !menu.contains(e.target) && e.target !== btn) menu.hidden = true;
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') menu.hidden = true;
    });
  }

  (async () => {
    const result = window.__APP_SESSION || await requireSession();
    if (!result) return;
    window.__APP_SESSION = result;
    window.__APP_SESSION = result;

    currentAccountId = result.membership.account_id;
    const businessName = result.membership.accounts?.business_name || 'Your business';
    if (!window.__SHELL_WIRED) {
      window.__SHELL_WIRED = true;
      wireAccountMenu(currentAccountId, businessName, result.session.user.email);
      wireSignOut();
    }
    showTrialBannerIfNeeded(currentAccountId);

    loadInvoices();
  })();
</script>
</body>
</html>
