<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Set a new password — PrimeLevel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F9F9FA; --surface:#F9F9FA; --surface-2:#F1EFE9; --border:#E3DFD3;
    --text:#1E2633; --text-soft:#5C6472; --text-faint:#8B92A0;
    --brand-navy:#1E2633; --brand-gold:#B29B68; --brand-gold-soft:#B29B68;
    --good:#2F7D5B; --good-bg:#E6F1EB; --warn:#B4552B; --warn-bg:#F6E7DE;
    --info:#3D5A80; --info-bg:#E7ECF2;
    --shadow: 0 1px 2px rgba(30,38,51,0.06), 0 8px 24px rgba(30,38,51,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12171F; --surface:#1E2633; --surface-2:#242E3B; --border:#333E4F;
      --text:#F1EEE6; --text-soft:#A7AEBA; --text-faint:#7B8393;
      --brand-navy:#AFC3E6; --brand-gold:#B29B68; --brand-gold-soft:#B29B68;
      --good:#57B78E; --good-bg:#1D3A30; --warn:#DD8E5D; --warn-bg:#402C1F;
      --info:#87A6CE; --info-bg:#22314A;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12171F; --surface:#1E2633; --surface-2:#242E3B; --border:#333E4F;
    --text:#F1EEE6; --text-soft:#A7AEBA; --text-faint:#7B8393;
    --brand-navy:#AFC3E6; --brand-gold:#B29B68; --brand-gold-soft:#B29B68;
    --good:#57B78E; --good-bg:#1D3A30; --warn:#DD8E5D; --warn-bg:#402C1F;
    --info:#87A6CE; --info-bg:#22314A;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ margin:0; padding:0; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Archivo',ui-sans-serif,system-ui,sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; }

  header{ display:flex; align-items:center; justify-content:space-between; padding:22px 48px; max-width:1180px; margin:0 auto; }
  .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; }
  .brand-mark{ width:32px;height:32px;border-radius:8px; overflow:hidden; display:flex;align-items:center;justify-content:center; flex:none; }
  .brand-mark img{ width:100%; height:100%; object-fit:cover; display:block; }
  .brand-word{ font-family:'Fraunces',serif; font-weight:600; font-size:19px; color:var(--text); }

  .wrap{ max-width:400px; margin:64px auto; padding:0 24px; }
  h1{ font-family:'Fraunces',serif; font-weight:500; font-size:28px; margin:0 0 8px; text-align:center; }
  .sub{ font-size:14px; color:var(--text-soft); text-align:center; margin:0 0 28px; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:24px 26px 26px; }
  .field-lbl{ font-size:11.5px; font-weight:600; color:#F9F9FA; text-transform:uppercase; letter-spacing:0.04em; margin:0 0 6px; }
  input{ width:100%; padding:11px 13px; border-radius:9px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:'Archivo',sans-serif; font-size:13.5px; margin-bottom:14px; }
  .cta-main{ width:100%; background:var(--brand-navy); color:#F7F4EC; border:none; border-radius:10px; padding:13px; font-weight:700; font-size:14.5px; cursor:pointer; }
  .cta-main:disabled{ opacity:0.6; cursor:default; }
  :root[data-theme="dark"] .cta-main{ background:var(--brand-gold); color:#1A1406; }
  @media (prefers-color-scheme:dark){ .cta-main{ background:var(--brand-gold); color:#1A1406; } }

  .msg{ font-size:12.5px; border-radius:8px; padding:10px 12px; margin-bottom:14px; display:none; }
  .msg.show{ display:block; }
  .msg.err{ background:var(--warn-bg); color:var(--warn); }
  .msg.ok{ background:var(--good-bg); color:var(--good); }
</style>
</head>
<body>

  <div class="wrap">
    <h1>Set a new password</h1>
    <p class="sub" id="subText">Choose a new password for your PrimeLevel account.</p>

    <div class="card">
      <div class="msg" id="msg"></div>
      <form id="resetForm">
        <div class="field-lbl">New password</div>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="new-password" minlength="8">
        <div class="field-lbl">Confirm new password</div>
        <input type="password" id="password2" placeholder="••••••••" required autocomplete="new-password" minlength="8">
        <button type="submit" class="cta-main" id="submitBtn">Set new password →</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    wirePasswordToggles();
    const msg = document.getElementById('msg');
    function showMsg(text, kind) {
      msg.textContent = text;
      msg.className = 'msg show ' + kind;
    }

    // Clicking the emailed reset link brings Supabase back here with a
    // temporary "recovery" session already active — that's what lets
    // updateUser() below work without asking for the old password.
    let hasRecoverySession = false;
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) {
        hasRecoverySession = true;
      }
    });

    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (session) hasRecoverySession = true;
      if (!hasRecoverySession) {
        document.getElementById('subText').textContent =
          'This link has expired or already been used.';
        showMsg('Please request a new reset link from the sign-in page.', 'err');
        document.getElementById('resetForm').style.display = 'none';
      }
    });

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const p1 = document.getElementById('password').value;
      const p2 = document.getElementById('password2').value;

      if (p1 !== p2) {
        showMsg('Those two passwords don\'t match — please try again.', 'err');
        return;
      }
      if (p1.length < 8) {
        showMsg('Please use at least 8 characters.', 'err');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving…';

      const { error } = await supabaseClient.auth.updateUser({ password: p1 });

      if (error) {
        showMsg('Something went wrong — please request a new reset link and try again.', 'err');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Set new password →';
        return;
      }

      showMsg('Password updated — taking you to your dashboard…', 'ok');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
    });
  </script>

</body>
</html>
